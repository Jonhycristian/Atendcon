[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/Downloads/*"
  [headers.values]
    Content-Disposition = "attachment"

# Cache agressivo para assets com hash do Vite (nomes mudam a cada build)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Segurança básica sem quebrar embeds (mapa, WhatsApp)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
